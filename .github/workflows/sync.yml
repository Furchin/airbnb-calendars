name: sync calendars

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python merge.py
        env:
          CAL_SOURCES: ${{ secrets.CAL_SOURCES }}
      - name: commit changed feeds
        run: |
          git config user.name "calendar-sync"
          git config user.email "actions@users.noreply.github.com"
          git add feeds
          git diff --cached --quiet || { git commit -m "update feeds" && git push; }
